spring:
  application:
    name: app
  
  # 프로파일 설정 (기본값: local)
  # 로컬 개발: SPRING_PROFILES_ACTIVE=local (기본값)
  # Render 배포: SPRING_PROFILES_ACTIVE=render
  # Oracle: SPRING_PROFILES_ACTIVE=oracle
  profiles:
    active: local
  
  # 기본 데이터베이스 설정 (H2 - 테스트용)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # 기본 JPA 설정
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  # H2 콘솔 (개발용, http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

# 서버 포트
server:
  port: 8080

# 로깅 설정
logging:
  level:
    com.example.app: DEBUG
    com.example.app.config: DEBUG
    org.springframework.security: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.postgresql: INFO
    com.zaxxer.hikari: DEBUG
    org.springframework.boot.autoconfigure.jdbc: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.filter: DEBUG

# 애플리케이션 커스텀 설정
app:
  # 데이터베이스 연결 테스트 설정
  db:
    test:
      enabled: true
  
  # JWT 설정
  jwt:
    secret: your-secret-key-change-this-in-production-minimum-256-bits
    expiration-millis: 3600000

---
# Oracle 프로파일 설정 (추후 사용 가능)
spring:
  config:
    activate:
      on-profile: oracle
  
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: aop
    password: 1234
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
    open-in-view: false
