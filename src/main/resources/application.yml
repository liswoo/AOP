spring:
  application:
    name: app
  
  # 데이터베이스 설정
  datasource:
    # PostgreSQL 사용 시 (주석 해제)
    # url: jdbc:postgresql://localhost:5432/appdb
    # username: postgres
    # password: postgres
    # driver-class-name: org.postgresql.Driver
    
    # H2 인메모리 데이터베이스 (개발용)
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update  # 개발용: 엔티티 변경 시 자동으로 스키마 업데이트
    show-sql: true      # SQL 쿼리 로그 출력
    properties:
      hibernate:
        format_sql: true  # SQL 포맷팅
    database-platform: org.hibernate.dialect.H2Dialect  # H2 사용 시
    # PostgreSQL 사용 시 아래 주석 해제
    # database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  # H2 콘솔 (개발용, http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

# 서버 포트
server:
  port: 8080

# 로깅 설정
logging:
  level:
    com.example.app: DEBUG
    org.springframework.security: DEBUG

